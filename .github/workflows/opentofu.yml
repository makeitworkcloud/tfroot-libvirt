name: OpenTofu

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  opentofu:
    uses: makeitworkcloud/shared-workflows/.github/workflows/opentofu.yml@main
    with:
      # Self-hosted dind runner from kustomize-cluster/workloads/arc; matches the
      # `arc-dind` label on the RunnerDeployment. Until the k3s cluster is up
      # and the runner pods are registered, this job will queue.
      runs-on: arc-dind
      container: ghcr.io/makeitworkcloud/tfroot-runner:latest
      setup-ssh: true
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
