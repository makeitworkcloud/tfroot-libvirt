#cloud-config
# https://cloudinit.readthedocs.io/en/latest/topics/examples.html

write_files:
  # ArgoCD root Application — points at the kustomize-cluster repo root, which
  # builds bootstrap + workloads. Once applied, ArgoCD self-manages from here.
  - path: /etc/k3s-bootstrap/root-app.yaml
    permissions: '0644'
    content: |
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: cluster-root
        namespace: argocd
        finalizers:
          - resources-finalizer.argocd.argoproj.io
      spec:
        project: default
        source:
          repoURL: ${cluster_repo_url}
          targetRevision: ${cluster_repo_branch}
          path: ${cluster_repo_path}
        destination:
          server: https://kubernetes.default.svc
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true

groups:
  - default
  - name: wheel

users:
  - default
  - name: user
    groups: [wheel]
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - ${ssh_authorized_key}

packages:
  - curl

fs_setup:
  - device: /dev/vdb
    filesystem: xfs
    overwrite: false

mounts:
  - ["/dev/vdb", "/var/lib/rancher", "xfs", "defaults", "0", "0"]

runcmd:
  - sed -i 's/^SELINUX=.*/SELINUX=permissive/' /etc/selinux/config
  - setenforce 0
  - mkdir -p /var/lib/rancher
  - |
    set -e
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION='${k3s_version}' \
      sh -s - server --disable=traefik --disable=servicelb --write-kubeconfig-mode=0644
  - |
    set -e
    export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
    until kubectl get nodes 2>/dev/null | grep -q ' Ready '; do sleep 3; done
  - |
    set -e
    export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
    kubectl create namespace argocd
    kubectl apply -n argocd --server-side -f \
      "https://raw.githubusercontent.com/argoproj/argo-cd/${argocd_version}/manifests/install.yaml"
    until kubectl -n argocd get crd applications.argoproj.io 2>/dev/null; do sleep 3; done
    until kubectl -n argocd rollout status deploy/argocd-server --timeout=10s 2>/dev/null; do sleep 5; done
    kubectl apply -f /etc/k3s-bootstrap/root-app.yaml
