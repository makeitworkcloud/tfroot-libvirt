#cloud-config
# https://cloudinit.readthedocs.io/en/latest/topics/examples.html

write_files:
  - path: /usr/local/bin/docker-cleanup.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      # Prune old Docker images, keeping only the most recent per repository
      # Also cleans dangling images and old build cache

      set -euo pipefail

      # Remove dangling images (untagged, intermediate layers)
      docker image prune -f

      # Remove older tags, keeping only the most recently created per repository
      # Skip repositories with only one image
      docker images --format '{{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.CreatedAt}}' | \
        grep -v '^<none>' | \
        sort -t$'\t' -k1,1 -k4,4r | \
        awk -F'\t' '
          {
            repo = $1
            id = $3
            if (seen[repo]++) {
              if (!keep[id]) print id
            } else {
              keep[id] = 1
            }
          }
        ' | sort -u | xargs -r docker rmi 2>/dev/null || true

      # Prune build cache older than 7 days
      docker builder prune -f --filter "until=168h"

groups:
  - default
  - name: wheel

packages:
  - docker

users:
  - default
  - name: user
    groups: [ wheel, docker ]
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - ${ssh_authorized_key}

fs_setup:
  - device: /dev/vdb
    filesystem: xfs
    overwrite: false
  - device: /dev/vdc
    filesystem: xfs
    overwrite: false

mounts:
  - ["/dev/vdb", "/var/lib/docker", "xfs", "defaults", "0", "0"]
  - ["/dev/vdc", "/opt/actions-runner", "xfs", "defaults", "0", "0"]

runcmd:
  - [ systemctl, daemon-reload ]
  - [ systemctl, enable, docker.service ]
  - [ systemctl, start, --no-block, docker.service ]
  - chown user:user /opt/actions-runner
  - echo "0 */6 * * * root /usr/local/bin/docker-cleanup.sh >> /var/log/docker-cleanup.log 2>&1" > /etc/cron.d/docker-cleanup
